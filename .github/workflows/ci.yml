name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: python3 -m compileall -q scripts
      - run: python3 scripts/check_public_release.py --history
      - name: Bootstrap and validate a synthetic external hub
        run: |
          tmp=$(mktemp -d)
          scripts/planctl.py --root "$tmp/hub" init
          scripts/planctl.py --root "$tmp/hub" allocate DEMO ci-plan
          scripts/planctl.py --root "$tmp/hub" validate
